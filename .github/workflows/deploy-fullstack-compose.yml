name: Deploy Fullstack (Docker Compose)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fullstack-compose
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          FULLSTACK_ENV_PRODUCTION: ${{ secrets.FULLSTACK_ENV_PRODUCTION }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$FULLSTACK_ENV_PRODUCTION"
          case "$VPS_PORT" in
            ''|*[!0-9]*) echo "::error::VPS_PORT must be a number (1-65535)"; exit 1;;
          esac

      - name: Prepare SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            echo "ssh-keyscan attempt ${attempt}/3 failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Cannot reach the VPS over SSH — the host is down, a firewall/fail2ban is dropping GitHub runner IPs, or the VPS_HOST/VPS_PORT secret is stale."
          exit 1

      - name: Write .env.production from secret
        run: |
          printf '%s' "${{ secrets.FULLSTACK_ENV_PRODUCTION }}" > .env.production

      - name: Set deployment metadata
        run: |
          echo "DEPLOY_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "DEPLOY_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "DEPLOYED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Docker SSH context
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          unset DOCKER_HOST DOCKER_CONTEXT
          if [ "$VPS_PORT" = "22" ]; then
            VPS_DOCKER_ENDPOINT="ssh://${VPS_USER}@${VPS_HOST}"
          else
            VPS_DOCKER_ENDPOINT="ssh://${VPS_USER}@${VPS_HOST}:${VPS_PORT}"
          fi
          docker context create vps --docker "host=${VPS_DOCKER_ENDPOINT}"
          docker --context vps version

      - name: Deploy stack over Docker SSH
        run: |
          unset DOCKER_HOST DOCKER_CONTEXT
          docker --context vps compose -f docker-compose.prod.yml --env-file .env.production build frontend backend
          docker --context vps compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
          docker --context vps compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps --force-recreate frontend
          docker --context vps compose -f docker-compose.prod.yml --env-file .env.production ps

      - name: Healthchecks
        run: |
          set -a
          . ./.env.production
          set +a
          FRONTEND_HOST_PORT="${FRONTEND_HOST_PORT:-9003}"
          BACKEND_HOST_PORT="${BACKEND_HOST_PORT:-3006}"
          ssh -p "${{ secrets.VPS_PORT || '22' }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "FRONTEND_HOST_PORT='${FRONTEND_HOST_PORT}' BACKEND_HOST_PORT='${BACKEND_HOST_PORT}' DEPLOY_SHA='${DEPLOY_SHA}' DEPLOY_VERSION='${DEPLOY_VERSION}' DEPLOYED_AT='${DEPLOYED_AT}' bash -s" << 'EOF'
          set -euo pipefail
          wget -qO- "http://localhost:${BACKEND_HOST_PORT}/api/health" >/dev/null
          wget -qO- "http://localhost:${FRONTEND_HOST_PORT}/" >/dev/null
          DEPLOY_METADATA="$(wget -qO- "http://localhost:${FRONTEND_HOST_PORT}/deploy-version.json")"
          printf '%s' "${DEPLOY_METADATA}" | grep "\"revision\":\"${DEPLOY_SHA}\"" >/dev/null
          printf '%s' "${DEPLOY_METADATA}" | grep "\"version\":${DEPLOY_VERSION}" >/dev/null
          printf '%s' "${DEPLOY_METADATA}" | grep "\"deployedAt\":\"${DEPLOYED_AT}\"" >/dev/null
          EOF
