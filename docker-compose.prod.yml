# The project name and the postgres volume name are pinned on purpose:
# compose derives volume names from the project name, so changing either
# (flag, env var, or deploy directory) would silently attach postgres to a
# fresh empty volume. Keep these stable across workflow rewrites.
name: mon-mariage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mon_mariage}
      POSTGRES_USER: ${POSTGRES_USER:-mon_mariage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mon_mariage}
      DB_USER: ${DB_USER:-mon_mariage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: ${DB_SSL:-false}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      BOOTSTRAP_ORGANIZER_EMAIL: ${BOOTSTRAP_ORGANIZER_EMAIL:?BOOTSTRAP_ORGANIZER_EMAIL is required}
      BOOTSTRAP_ORGANIZER_PASSWORD: ${BOOTSTRAP_ORGANIZER_PASSWORD:?BOOTSTRAP_ORGANIZER_PASSWORD is required}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      SMTP_HOST: "${SMTP_HOST:?SMTP_HOST is required}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-true}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:?MAIL_FROM is required}"
      WEDDING_DATE: ${WEDDING_DATE:-2027-07-16}
      WEDDING_PLACE: ${WEDDING_PLACE:-Escayrac}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:${BACKEND_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-local}
        DEPLOY_VERSION: ${DEPLOY_VERSION:-0}
        DEPLOYED_AT: ${DEPLOYED_AT:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
      public_proxy:
        aliases:
          - mon-mariage-frontend
    # Keep the diagnostic host port private; Caddy reaches the container over
    # the shared Docker network and publishes the public HTTPS endpoint.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # qr_caddy (qr-code project) joins this network to proxy
  # mon-mariage.duckdns.org -> mon-mariage-frontend-1:80. Renaming the
  # project, this network, or the frontend service breaks the reverse proxy.
  default:
    name: mon-mariage_default
  public_proxy:
    external: true
    name: qr-code_app_net

volumes:
  postgres_data:
    name: mon-mariage_postgres_data
