<main class="auth-page">
  <section class="auth-card">
    <div class="script-note">Mariage · espace privé</div>
    <h1>Se connecter</h1>
    <p class="muted">Les accès sont créés et transmis directement par les organisateurs.</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Adresse e-mail</span>
        <input type="email" name="email" autocomplete="email" [(ngModel)]="email" required autofocus />
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" name="password" autocomplete="current-password" [(ngModel)]="password" required />
      </label>
      @if (error) { <p class="form-error" role="alert">{{ error }}</p> }
      <button class="btn primary auth-submit" type="submit" [disabled]="loading() || !email || !password">
        {{ loading() ? 'Veuillez patienter…' : 'Se connecter' }}
      </button>
    </form>
  </section>
</main>
