# Dedicated preprod stack. Project name, volume, and default network are
# pinned so this file cannot attach to production postgres
# (mon-mariage_postgres_data) even if invoked from the prod directory.
name: mon-mariage-preprod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mon_mariage_preprod}
      POSTGRES_USER: ${POSTGRES_USER:-mon_mariage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mon_mariage_preprod}
      DB_USER: ${DB_USER:-mon_mariage}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSL: ${DB_SSL:-false}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      PRIVATE_EVENT_CODE: ${PRIVATE_EVENT_CODE:?PRIVATE_EVENT_CODE is required}
      BOOTSTRAP_ORGANIZER_EMAIL: ${BOOTSTRAP_ORGANIZER_EMAIL:?BOOTSTRAP_ORGANIZER_EMAIL is required}
      BOOTSTRAP_ORGANIZER_PASSWORD: ${BOOTSTRAP_ORGANIZER_PASSWORD:?BOOTSTRAP_ORGANIZER_PASSWORD is required}
      WEDDING_DATE: ${WEDDING_DATE:-2027-07-16}
      WEDDING_PLACE: ${WEDDING_PLACE:-Escayrac}
      TIMEZONE: ${TIMEZONE:-Europe/Paris}
      COUPLE_NAME_1: ${COUPLE_NAME_1:-}
      COUPLE_NAME_2: ${COUPLE_NAME_2:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3008}:${BACKEND_PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-local}
        DEPLOY_VERSION: ${DEPLOY_VERSION:-0}
        DEPLOYED_AT: ${DEPLOYED_AT:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Keep the diagnostic host port private; Caddy reaches this container as
    # mon-mariage-preprod-frontend-1 on mon-mariage-preprod_default.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-9004}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: mon-mariage-preprod_default

volumes:
  postgres_data:
    name: mon-mariage-preprod_postgres_data
